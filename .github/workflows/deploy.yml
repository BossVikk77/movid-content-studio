name: Deploy Movid Academy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          HCTI_UID: ${{ secrets.HCTI_UID }}
          HCTI_KEY: ${{ secrets.HCTI_KEY }}
        run: |
          cat > config.js <<EOF
          window.__MOVID_CONFIG__ = {
            GROQ_KEY: '${GROQ_KEY}',
            HCTI_UID: '${HCTI_UID}',
            HCTI_KEY: '${HCTI_KEY}'
          };
          EOF
          echo "✅ config.js generated."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # deploy the whole repo root (index = movid-academy.html)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
