name: Generate Social Media Image

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Output filename e.g. 2026-05-24-143022.png'
        required: true
      postType:
        description: 'Post type label'
        required: true
      imageHook:
        description: 'Image headline'
        required: true
      imageBody:
        description: 'Image subtitle'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate image
        env:
          FILENAME: ${{ inputs.filename }}
          POST_TYPE: ${{ inputs.postType }}
          IMAGE_HOOK: ${{ inputs.imageHook }}
          IMAGE_BODY: ${{ inputs.imageBody }}
        run: node generate-image.js

      - name: Commit image to repo
        run: |
          git config user.name "Movid Bot"
          git config user.email "bot@movid.academy"
          git add images/
          git diff --staged --quiet || git commit -m "img: ${{ inputs.filename }}"
          git push

      - name: Generate config.js from secrets
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          HCTI_UID: ${{ secrets.HCTI_UID }}
          HCTI_KEY: ${{ secrets.HCTI_KEY }}
        run: |
          cat > config.js <<EOF
          window.__MOVID_CONFIG__ = {
            GROQ_KEY: '${GROQ_KEY}',
            HCTI_UID: '${HCTI_UID}',
            HCTI_KEY: '${HCTI_KEY}'
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
