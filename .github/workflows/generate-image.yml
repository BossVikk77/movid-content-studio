name: Generate Social Media Image

on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Output filename e.g. 2026-05-24-143022.png'
        required: true
      postType:
        description: 'Post type label'
        required: true
      imageHook:
        description: 'Image headline'
        required: true
      imageBody:
        description: 'Image subtitle'
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate image
        env:
          FILENAME: ${{ inputs.filename }}
          POST_TYPE: ${{ inputs.postType }}
          IMAGE_HOOK: ${{ inputs.imageHook }}
          IMAGE_BODY: ${{ inputs.imageBody }}
        run: node generate-image.js

      - name: Commit and push image
        run: |
          git config user.name "Movid Bot"
          git config user.email "bot@movid.academy"
          git add images/
          git diff --staged --quiet || git commit -m "img: ${{ inputs.filename }}"
          git push
